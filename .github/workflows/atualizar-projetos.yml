name: Atualizar projetos recentes

on:
  schedule:
    - cron: "0 6 * * *"    # todo dia às 06:00 UTC
  workflow_dispatch:        # botão "Run workflow" na aba Actions

permissions:
  contents: write           # precisa commitar o README

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar seção de projetos
        run: python3 .github/scripts/atualizar_projetos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commitar se o README mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards/
          git diff --cached --quiet || (git commit -m "chore: atualiza projetos recentes" && git push)
