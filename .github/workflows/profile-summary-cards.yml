name: Gerar cards de stats

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC
  workflow_dispatch:       # botão "Run workflow" na aba Actions

permissions:
  contents: write          # a Action precisa commitar os SVGs no repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Baixa o repositório; sem isso a pasta de trabalho não é um repo git
      # e o "git add" dos cards falha com código 128
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
